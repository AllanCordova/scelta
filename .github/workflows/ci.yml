name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain
        run: pnpm --filter @scelta/domain build

      - name: Lint
        run: pnpm --filter @scelta/api lint

      - name: Unit tests
        run: pnpm --filter @scelta/api test

      - name: Feature tests
        run: pnpm --filter @scelta/api test:feature

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @scelta/web lint

      - name: Unit tests
        run: pnpm --filter @scelta/web test

      - name: Install Playwright browser
        run: pnpm --filter @scelta/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @scelta/web test:e2e
