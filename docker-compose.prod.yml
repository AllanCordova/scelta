# Production stack: Web (Nginx SPA + reverse proxy), API (Fastify + Socket.IO), and PostgreSQL.
# Do not publish PostgreSQL or API directly to the host network.
#
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Home machine / Cloudflare Tunnel, stable hostname (home IP may change; the name does not):
#   docker compose --env-file .env.production -f docker-compose.prod.yml --profile share up -d --build
#   (In Cloudflare Zero Trust Tunnel Public Hostname, point the service to: http://web:80)

name: scelta-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: scelta-prod-web
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:80/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - scelta
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scelta-prod-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3333"
      DATABASE_URL: postgresql://${POSTGRES_USER:-scelta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scelta}
      CORS_ORIGIN: ${PUBLIC_URL:-http://127.0.0.1:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      CHURCH_NAME: ${CHURCH_NAME:-Igreja local}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - scelta
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: scelta-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scelta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scelta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-scelta} -d $${POSTGRES_DB:-scelta}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - scelta
    logging: *default-logging

  cloudflared:
    profiles: ["share"]
    image: cloudflare/cloudflared:latest
    container_name: scelta-prod-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - scelta
    logging: *default-logging

networks:
  scelta:
    driver: bridge

volumes:
  postgres_data:
    name: scelta_postgres_data
    external: true
